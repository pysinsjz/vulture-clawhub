components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token of the format "Bearer {token}" for normal authentication and "Convex {token}" for admin tokens.
  schemas:
    Request_appMeta.getDeploymentInfo:
      type: object
      required:
        - args
      properties:
        args:
          type: object

    Response_appMeta.getDeploymentInfo:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - "success"
            - "error"
        errorMessage:
          type: string
        errorData:
          type: object
        value: {}

    Request_auth.isAuthenticated:
      type: object
      required:
        - args
      properties:
        args:
          type: object

    Response_auth.isAuthenticated:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - "success"
            - "error"
        errorMessage:
          type: string
        errorData:
          type: object
        value: {}

    Request_auth.signIn:
      type: object
      required:
        - args
      properties:
        args:
          type: object
          properties:
            calledBy:
              type: string
            params: {}
            provider:
              type: string
            refreshToken:
              type: string
            verifier:
              type: string

    Response_auth.signIn:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - "success"
            - "error"
        errorMessage:
          type: string
        errorData:
          type: object
        value: {}

    Request_auth.signOut:
      type: object
      required:
        - args
      properties:
        args:
          type: object

    Response_auth.signOut:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - "success"
            - "error"
        errorMessage:
          type: string
        errorData:
          type: object
        value: {}

    Request_cliDeviceAuth.approve:
